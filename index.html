<style id="app-css">
/* Layout idea: workshop job board. Sticky header with tabs, summary strip, then status-striped job rows and car cards. */
:root{
  --bg:#e9ecef; --surface:#ffffff; --surface-2:#f4f6f8; --ink:#14181d; --muted:#5a6470; --line:#d3d9df;
  --accent:#2350c4; --accent-soft:#e3eafb; --accent-ink:#ffffff;
  --ok:#1d7f47; --ok-soft:#e1f2e8; --warn:#a96300; --warn-soft:#fbefd9; --bad:#c22d2d; --bad-soft:#fbe3e3;
  --display:'Barlow Condensed','Arial Narrow',sans-serif; --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --radius:10px; color-scheme:light;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --surface:#181c22; --surface-2:#1f242b; --ink:#e8ebee; --muted:#9aa4af; --line:#2e353e;
    --accent:#7d9cf0; --accent-soft:#1f2a45; --accent-ink:#0d1220;
    --ok:#5cc28a; --ok-soft:#173226; --warn:#e5a54a; --warn-soft:#3a2b14; --bad:#f07373; --bad-soft:#3d1c1d; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --surface:#181c22; --surface-2:#1f242b; --ink:#e8ebee; --muted:#9aa4af; --line:#2e353e;
  --accent:#7d9cf0; --accent-soft:#1f2a45; --accent-ink:#0d1220;
  --ok:#5cc28a; --ok-soft:#173226; --warn:#e5a54a; --warn-soft:#3a2b14; --bad:#f07373; --bad-soft:#3d1c1d; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.02em;text-wrap:balance;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
.top-row{display:flex;align-items:center;gap:12px;padding:12px 0 6px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;color:var(--accent)}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.saved i{background:var(--ok)} .status.saving i{background:var(--warn)} .status.error i{background:var(--bad)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a .count{font-family:var(--mono);font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:1px 6px;margin-left:6px}
main{padding:22px 0 60px;display:flex;flex-direction:column;gap:22px}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:220px}
.section-head{display:flex;align-items:end;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:24px;text-transform:uppercase}
.section-head .sub{color:var(--muted);font-size:13px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;border-top:4px solid var(--line)}
.tile .n{font-family:var(--display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:13px;margin-top:4px}
.tile.bad{border-top-color:var(--bad)} .tile.bad .n{color:var(--bad)}
.tile.warn{border-top-color:var(--warn)} .tile.warn .n{color:var(--warn)}
.tile.acc{border-top-color:var(--accent)}
a.tile-link{color:inherit;text-decoration:none} a.tile-link:hover{border-color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:start}
.row.overdue{border-left-color:var(--bad)} .row.soon{border-left-color:var(--warn)} .row.planned{border-left-color:var(--accent)} .row.open{border-left-color:var(--muted)}
.row .title{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .meta{color:var(--muted);font-size:13px;display:flex;gap:6px 14px;flex-wrap:wrap;grid-column:1}
.row .notes{font-size:13px;color:var(--muted);grid-column:1;white-space:pre-wrap}
.row .actions{display:flex;gap:6px;grid-row:1 / span 3;grid-column:2;align-self:center;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;gap:6px;flex-wrap:wrap;grid-column:1}
.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.buy{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.borrow{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.own{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.pill{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:4px}
.pill.overdue{background:var(--bad-soft);color:var(--bad)} .pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.planned{background:var(--accent-soft);color:var(--accent)} .pill.open{background:var(--surface-2);color:var(--muted)}
.pill.high{background:var(--bad);color:#fff}
.plate{font-family:var(--mono);font-weight:600;font-size:12px;background:#111;color:#f5f5f5;padding:2px 7px;border-radius:3px;letter-spacing:.06em;white-space:nowrap;border:1px solid #444}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.car{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.car-head{display:flex;justify-content:space-between;gap:10px;align-items:start}
.car h3{font-size:22px}
.car .model{color:var(--muted);font-size:13px}
.odo{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:flex;justify-content:space-between;align-items:baseline}
.odo small{font-family:var(--body);font-size:12px;color:var(--muted)}
.kv{font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters .fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.filters .fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:13px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:24px;text-align:center;color:var(--muted)}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--surface-2)}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
th.num{text-align:right}
td .small{color:var(--muted);font-size:12px}
tfoot td{font-weight:600}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;align-items:start}
.panel{display:flex;flex-direction:column;gap:10px}
.panel h3{font-size:18px;text-transform:uppercase;color:var(--muted)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:560px;padding:20px;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:24px;text-transform:uppercase;margin-bottom:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1 / -1}
.field label,.field .lbl{font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px 10px;width:100%}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:12px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--ink);cursor:pointer;background:var(--surface-2)}
.checks input{width:auto}
.hints{background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.hints-head{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.hint-row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.hint-row b{font-weight:600;font-size:14px}
.why{font-size:12px;color:var(--muted)}
.ok-tag{color:var(--ok);font-size:13px;font-weight:600;white-space:nowrap}
.tool-filters input[type=search]{flex:1;min-width:200px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px}
.tool-groups{display:flex;flex-direction:column;gap:20px}
.count-muted{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:500}
.tasks{grid-column:1;display:flex;flex-direction:column;gap:3px;font-size:13px}
.task{color:var(--muted)} .task b{color:var(--ink);font-weight:600}
.task.overdue .due{color:var(--bad);font-weight:600} .task.soon .due{color:var(--warn);font-weight:600} .task.open .due{font-style:italic}
.task-rows{display:flex;flex-direction:column;gap:8px}
.task-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.task-row label{display:flex;align-items:center;gap:6px;white-space:nowrap}
.task-row input{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:7px 9px;color:var(--ink)}
.task-row input.short{width:56px}
.hist{display:flex;flex-direction:column;gap:6px;font-size:13px;max-height:180px;overflow-y:auto;border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--surface-2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.form>*{min-width:0}
.task-row{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px}
.task-row input{background:var(--surface)}
@media (max-width:760px){
  .task-row{display:flex;flex-wrap:wrap;gap:8px}
  .task-row input[name=task_title]{flex:1 1 100%;min-width:0}
  .task-row label{flex:1 1 auto;min-width:0}
  .task-row input[type=date]{flex:1;min-width:0;width:100%}
  .task-row .btn{margin-left:auto}
}
.sp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card h3{font-size:18px;text-transform:uppercase;color:var(--muted)}
.bl{display:flex;flex-direction:column;gap:10px}
.bl-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bl-top.big{padding-bottom:8px;border-bottom:1px solid var(--line)} .bl-top.big:last-child{border-bottom:0;padding-bottom:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted);font-size:12px}
.time-sum{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.time-sum .n{font-family:var(--display);font-size:28px}
.bl-track{height:8px;background:var(--surface-2);border-radius:4px;margin-top:4px;overflow:hidden}
.bl-fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.small-empty{padding:14px}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i,.tip i,.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{position:relative;height:220px;margin:8px 0 4px 44px}
.grid{position:absolute;inset:0 0 22px 0}
.gl{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.gl span{position:absolute;right:calc(100% + 6px);top:-8px;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.gl:last-child{border-top:1px solid var(--muted)}
.cols{position:absolute;inset:0;display:flex;gap:2px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;cursor:pointer;min-width:0;border-radius:4px}
.col:hover .stack,.col.on .stack{filter:brightness(1.1)}
.col.on{background:var(--surface-2)}
.stack-wrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.stack{width:min(28px,70%);display:flex;flex-direction:column-reverse;gap:2px;border-radius:4px 4px 0 0;overflow:hidden;min-height:0}

.xl{height:22px;line-height:22px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.chart-card{position:relative}
.tip{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.15);min-width:170px;pointer-events:none;z-index:2}
.tip-total{font-family:var(--mono);font-size:16px;margin:2px 0 4px}
.tip-row{display:flex;justify-content:space-between;gap:12px;color:var(--muted);white-space:nowrap}
.tip-row span:last-child{font-family:var(--mono);color:var(--ink)}
@media (max-width:760px){ .sp-grid{grid-template-columns:1fr} .xl{font-size:10px}
  .sp-table th:nth-child(3),.sp-table td:nth-child(3),.sp-table th:nth-child(4),.sp-table td:nth-child(4){display:none} .sp-table th,.sp-table td{padding:9px 8px} .sp-table td:first-child{white-space:normal!important;width:64px} .sp-cat{display:block!important} }
.sp-cat{display:none;margin-top:2px}
@media (max-width:760px){ .tip{position:static;box-shadow:none;width:100%;margin-top:4px} }
.runbar{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--ok);border-left:5px solid var(--ok);border-radius:var(--radius);padding:10px 14px}
.runbar .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.rb-what{flex:1;min-width:200px}
.rb-act{display:flex;gap:6px}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink)}
.clock.big{font-size:20px}
.row.running{border-left-color:var(--ok)}
.timer-line .clock{color:var(--ok)}
.cal-card{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;font-size:13px;color:var(--muted)}
.cal-card p{margin:0;flex:1;min-width:220px}
.est{font-size:12px;color:var(--muted)}
.m-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;grid-column:1 / -1;flex-wrap:wrap}
.m-actions .left{margin-right:auto}
.backup textarea{width:100%;min-height:140px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);padding:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.card p{margin:0;color:var(--muted);max-width:65ch}
.msg{font-size:13px}
.msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
@media (max-width:760px){
  .summary{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  .row .actions{grid-row:auto;grid-column:1;justify-content:flex-start}

  .wrap{padding:0 16px}
  .brand{font-size:21px}
  .top-row{padding-top:8px}
  .tile .n{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

}

  if(!k.last) return {status:'open',due:null,days:null,text:'No date recorded yet'};

}

function suggestTools(text){
  var out=[]; if(!text) return out;
  TOOL_GUIDE.forEach(function(r){ if(r[0].test(text)) r[1].forEach(function(k){ if(out.indexOf(k)<0) out.push(k); }); });
  if(out.indexOf('transcan')>-1 && out.indexOf('scan')>-1) out.splice(out.indexOf('scan'),1);
  if(out.indexOf('transcan')>-1 && out.indexOf('epb')>-1) out.splice(out.indexOf('epb'),1);

}

  }
  box.addEventListener('click',function(e){
    var b=e.target.closest('[data-h]'); if(!b) return;
    var ids=checkedIds(), id=b.getAttribute('data-id');

    refreshTools(ids); update();
  });
  title.addEventListener('input',update);
  f.addEventListener('change',function(e){ if(e.target.name==='tools') update(); });
  update();

  (c.readings||[]).forEach(function(r){ pts.push([r.date,Number(r.km)]); });
  if(c.odo!=null && c.odoDate) pts.push([c.odoDate,Number(c.odo)]);
  pts.sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:a[1]-b[1];});
  if(pts.length<2) return null;
  var last=pts[pts.length-1], first=pts[0];
  for(var i=0;i<pts.length;i++){ if(daysBetween(pts[i][0],last[0])<=400){ first=pts[i]; break; } }
  var d=daysBetween(first[0],last[0]); if(d<30 || last[1]<=first[1]) return null;
  return (last[1]-first[1])/d;
}
function estOdo(c){
  if(!c || c.odo==null) return null; var r=kmRate(c); if(!r || !c.odoDate) return {km:c.odo,est:false,rate:r};
  var d=Math.max(0,daysBetween(c.odoDate,todayStr())); return {km:Math.round(c.odo+r*d),est:d>0,rate:r,days:d};
}
function jobInfo(j){
  var car=carById(j.carId), t=todayStr(), days=null, km=null, parts=[], estDate=null;
  if(j.dueDate){ days=daysBetween(t,j.dueDate);
    parts.push(fmtD(j.dueDate)+' · '+(days<0? Math.abs(days)+' days overdue' : days===0?'today': 'in '+days+' day'+(days===1?'':'s'))); }
  if(j.dueKm!=null){
    var eo=estOdo(car);
    if(eo){ km=j.dueKm-eo.km;
      var tx='at '+fmtKm(j.dueKm)+' · '+(eo.est?'about ':'')+(km<=0? fmtNum(-km)+' km over' : fmtNum(km)+' km to go');
      if(eo.rate && km>0){ estDate=addDays(t,Math.ceil(km/eo.rate)); tx+=' · around '+fmtD(estDate); }
      parts.push(tx); }
    else parts.push('at '+fmtKm(j.dueKm)); }
  var st = ((days!=null&&days<0)||(km!=null&&km<=0)) ? 'overdue' : ((days!=null&&days<=30)||(km!=null&&km<=1000)) ? 'soon' : (days==null&&km==null) ? 'open' : 'planned';
  var remind=j.dueDate&&estDate?(j.dueDate<estDate?j.dueDate:estDate):(j.dueDate||estDate);
  return {status:st, days:days, km:km, estDate:estDate, remind:remind, text:parts.join('  |  ')||'No due date set'};
}
var RANK={overdue:0,soon:1,planned:2,open:3};
var LABEL={overdue:'Overdue',soon:'Due soon',planned:'Planned',open:'Whenever'};
function sortedJobs(list){
  return list.map(function(j){ return {j:j,i:jobInfo(j)}; }).sort(function(a,b){
    if(RANK[a.i.status]!==RANK[b.i.status]) return RANK[a.i.status]-RANK[b.i.status];
    if(a.j.priority!==b.j.priority){ var p={high:0,normal:1,low:2}; return (p[a.j.priority]||1)-(p[b.j.priority]||1); }
    var ad=a.i.days==null?99999:a.i.days, bd=b.i.days==null?99999:b.i.days;
    var ak=a.i.km==null?99999:a.i.km/40, bk=b.i.km==null?99999:b.i.km/40;
    return Math.min(ad,ak)-Math.min(bd,bk);
  });
}
function toolChips(ids){
  if(!ids||!ids.length) return '';
  return ids.map(function(id){ var t=toolById(id); if(!t) return '';

function buildDoc(){

    '<script type="application/json" id="garage-data">'+json+E+'script>\n<script id="app-js">'+js+E+'script>\n</body>\n</html>\n';
}
function save(){
  dirty=true; setSave('saving');
  clearTimeout(saveTimer); saveTimer=setTimeout(flush,250);
}
function flush(){
  if(!dirty || mode==='pending') return;
  dirty=false;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ setSave('error'); return; }
  if(mode==='artifact'){
    api.publish(buildDoc()).then(function(){ setSave('saved'); }).catch(function(e){
      var c=String(e&&(e.code||e.name||e.message)||e);
      if(/not_granted|not_writer/.test(c)){ mode='readonly'; setSave('readonly'); }
      else if(/conflict/.test(c)){ setSave('saved'); }
      else setSave('error');
    });
  } else setSave('saved');
}
function setSave(s){ saveState=s; var el=document.getElementById('save-status'); if(el) el.outerHTML=statusHtml(); }
function statusHtml(){

}

/* ---------- job timer ---------- */
function jobById(id){ for(var i=0;i<state.jobs.length;i++) if(state.jobs[i].id===id) return state.jobs[i]; return null; }
function jobElapsed(j){ var t=0, now=Date.now(); (j.sessions||[]).forEach(function(s){ t+=(s.e||now)-s.s; }); return Math.max(0,t); }
function jobRunning(j){ var s=j.sessions||[]; return !!(s.length && !s[s.length-1].e); }
function fmtClock(ms){ var t=Math.floor(ms/1000), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60; return h+':'+pad(m)+':'+pad(s); }
function fmtDur(min){ if(min==null||min==='') return ''; min=Math.round(min); var h=Math.floor(min/60), m=min%60; return h&&m?h+'h '+m+'m':h?h+'h':m+'m'; }
function parseDur(v){
  v=String(v||'').trim().toLowerCase(); if(!v) return null;
  var a=v.match(/^(\d+):(\d{1,2})$/); if(a) return +a[1]*60 + +a[2];
  var b=v.match(/^(?:(\d+(?:\.\d+)?)\s*h(?:rs?|ours?)?)?\s*(?:(\d+)\s*m(?:in(?:s|utes?)?)?)?$/); if(b && (b[1]||b[2])) return Math.round((+b[1]||0)*60+(+b[2]||0));
  var n=parseFloat(v); return isNaN(n)?null:Math.round(n*60);
}
function timerStart(j){ var now=Date.now(); state.jobs.forEach(function(o){ if(o!==j && jobRunning(o)) o.sessions[o.sessions.length-1].e=now; });
  if(!j.sessions) j.sessions=[]; if(!jobRunning(j)) j.sessions.push({s:now,e:null}); if(!j.startedOn) j.startedOn=todayStr(); }
function timerPause(j){ if(jobRunning(j)) j.sessions[j.sessions.length-1].e=Date.now(); }
function runBar(){
  var run=state.jobs.filter(jobRunning); if(!run.length) return '';
  return run.map(function(j){ var c=carById(j.carId);
    return '<div class="runbar" role="status"><span class="dot"></span><span class="rb-what">Working on '+plate(c)+' <b>'+esc(j.title)+'</b></span><span class="clock big" data-timer="'+j.id+'">'+fmtClock(jobElapsed(j))+'</span>'+
      '<span class="rb-act"><button class="btn sm" data-act="timer-pause" data-id="'+j.id+'">Pause</button><button class="btn sm primary" data-act="timer-finish" data-id="'+j.id+'">Finish</button></span></div>'; }).join('');
}
setInterval(function(){ var els=document.querySelectorAll('[data-timer]'); for(var i=0;i<els.length;i++){ var j=jobById(els[i].getAttribute('data-timer')); if(j && jobRunning(j)) els[i].textContent=fmtClock(jobElapsed(j)); } },1000);

/* ---------- calendar reminders (.ics) ---------- */
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }
function icsDate(s){ return s.replace(/-/g,''); }

function icsJobEvent(j){

  var est=!(j.dueDate && i.remind===j.dueDate);

    'SUMMARY:'+icsEsc((c?c.plate+' ':'')+j.title+(est?' (estimated)':'')),
    'DESCRIPTION:'+icsEsc((c?(c.name||'')+'\n':'')+i.text+(est?'\nDate estimated from your average daily km. Update the mileage in Garage App to keep it accurate.':'')),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(j.title+' due in a week'),'TRIGGER:-P6DT15H','END:VALARM',
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(j.title+' due today'),'TRIGGER:PT9H','END:VALARM','END:VEVENT'].join('\r\n');
}

    'SUMMARY:Update car mileage in Garage App','DESCRIPTION:'+icsEsc('Note each car\'s odometer and tap Update km in Garage App so km-based jobs stay on time.'),
    'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Update car mileage','TRIGGER:PT0M','END:VALARM','END:VEVENT'].join('\r\n');

function downloadIcs(name,events){

document.addEventListener('click',function(e){
  if(e.target.classList && e.target.classList.contains('scrim')){ closeModal(); return; }
  var spc=e.target.closest('[data-sp]'); if(spc){ spTip(spc); return; }
  var b=e.target.closest('[data-act]'); if(!b || b.tagName==='SELECT') return;
  var a=b.getAttribute('data-act'), id=b.getAttribute('data-id');

  switch(a){
    case 'close-modal': closeModal(); break;
    case 'fcar': ui.car=id; render(); break;

    case 'new-job': jobForm(null,id); break;
    case 'edit-job': jobForm(state.jobs.filter(function(j){return j.id===id;})[0]); break;

    case 'new-tool': toolForm(); break;
    case 'edit-tool': toolForm(toolById(id)); break;
    case 'tcat': ui.toolCat=id; render(); break;
    case 'tool-maint': toolMaintForm(toolById(id), b.getAttribute('data-task')); break;
    case 'sp-period': ui.spPeriod=id; render(); break;
    case 'sp-car': ui.spCar=id; render(); break;
    case 'new-exp': expForm(); break;
    case 'sp-open': var ty=b.getAttribute('data-type');
      if(ty==='log') logForm(state.log.filter(function(l){return l.id===id;})[0]);
      else if(ty==='tool') toolForm(toolById(id));
      else expForm(state.expenses.filter(function(x){return x.id===id;})[0]); break;
    case 'del-exp': confirmBox('Delete expense?','This removes it from your spending.','Delete expense',function(){ state.expenses=state.expenses.filter(function(x){return x.id!==id;}); commit(); }); break;
    case 'timer-start': timerStart(jobById(id)); commit(); break;
    case 'timer-pause': timerPause(jobById(id)); commit(); break;
    case 'timer-finish': var jf=jobById(id); timerPause(jf); commit(); doneForm(jf); break;
    case 'cal-job': var jc=jobById(id), ev=icsJobEvent(jc); if(ev) downloadIcs('garage-'+jc.title.replace(/[^a-z0-9]+/gi,'-').toLowerCase(),[ev]); break;
    case 'cal-all': var evs=state.jobs.map(icsJobEvent).filter(Boolean); if(evs.length) downloadIcs('garage-due-dates',evs); break;
    case 'cal-km': downloadIcs('garage-mileage-reminder',[icsMileage()]); break;
    case 'odo': odoForm(carById(id)); break;
    case 'del-job': confirmBox('Delete job?','This removes the job from your upcoming list.','Delete job',function(){ state.jobs=state.jobs.filter(function(j){return j.id!==id;}); commit(); }); break;
    case 'del-log': confirmBox('Delete history entry?','This removes the entry from the service history.','Delete entry',function(){ state.log=state.log.filter(function(l){return l.id!==id;}); commit(); }); break;
    case 'del-tool': confirmBox('Delete tool?','It will also be removed from any jobs and history entries that list it.','Delete tool',function(){
      state.tools=state.tools.filter(function(t){return t.id!==id;}); state.jobs.concat(state.log).forEach(function(x){ x.toolIds=(x.toolIds||[]).filter(function(t){return t!==id;}); }); commit(); }); break;
    case 'del-car': var c=carById(id), nj=state.jobs.filter(function(j){return j.carId===id;}).length, nl=state.log.filter(function(l){return l.carId===id;}).length;
      confirmBox('Delete '+(c.name||'car')+'?','This also deletes its '+nj+' upcoming job'+(nj===1?'':'s')+' and '+nl+' history entr'+(nl===1?'y':'ies')+'. Copy a backup first if you might want them.','Delete car and its records',function(){
        state.cars=state.cars.filter(function(x){return x.id!==id;}); state.jobs=state.jobs.filter(function(j){return j.carId!==id;}); state.log=state.log.filter(function(l){return l.carId!==id;}); if(ui.car===id) ui.car='all'; commit(); }); break;

    case 'clear-example': confirmBox('Start with an empty garage?','This removes all the example cars, jobs, history and tools.','Clear everything',function(){ state={example:false,cars:[],jobs:[],log:[],tools:[],expenses:[]}; ui.car='all'; commit(); }); break;
    case 'dl-backup': var blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'}), a2=document.createElement('a');
      a2.href=URL.createObjectURL(blob); a2.download='garage-app-backup-'+todayStr()+'.json'; document.body.appendChild(a2); a2.click();
      setTimeout(function(){ URL.revokeObjectURL(a2.href); a2.remove(); },1000); break;
    case 'copy-backup': var t=document.getElementById('bk-out'), m=document.getElementById('bk-msg');
      try{ navigator.clipboard.writeText(t.value).then(function(){ m.className='msg ok'; m.textContent='Copied.'; },function(){ t.select(); m.className='msg'; m.textContent='Select the text above and copy it.'; }); }

      try{ var d=JSON.parse(v); if(!d||!Array.isArray(d.cars)) throw 0; ['jobs','log','tools','expenses'].forEach(function(k){ if(!Array.isArray(d[k])) d[k]=[]; });

      }catch(err){ rm2.className='msg bad'; rm2.textContent='That text is not a Garage App backup. Paste the whole backup and try again.'; } break;
  }
});
